name: Deploy Production All

on:
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [sapmall-admin, sapmall-dapp, sapmall-website]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web_client/${{ matrix.app }}/package-lock.json

      - name: Install and build ${{ matrix.app }}
        working-directory: web_client/${{ matrix.app }}
        run: npm ci --legacy-peer-deps && npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: ${{ matrix.app == 'sapmall-admin' && secrets.ADMIN_API_BASE_URL || (matrix.app == 'sapmall-dapp' && secrets.DAPP_API_BASE_URL || '') }}
          REACT_APP_WALLETCONNECT_PROJECT_ID: ${{ matrix.app == 'sapmall-dapp' && secrets.WALLETCONNECT_PROJECT_ID || '' }}
          REACT_APP_SWAP_ROUTER_ADDRESS: ${{ matrix.app == 'sapmall-dapp' && secrets.SWAP_ROUTER_ADDRESS || '' }}
          REACT_APP_ADMIN_URL: ${{ matrix.app == 'sapmall-dapp' && secrets.ADMIN_URL || '' }}
          REACT_APP_SITE_URL: ${{ matrix.app == 'sapmall-website' && 'https://sapmall.xyz' || '' }}
          REACT_APP_DAPP_URL: ${{ matrix.app == 'sapmall-website' && secrets.DAPP_URL || '' }}
          REACT_APP_HELP_PATH: ${{ matrix.app == 'sapmall-website' && '/help' || '' }}
          REACT_APP_WHITEPAPER_URL: ${{ matrix.app == 'sapmall-website' && secrets.WHITEPAPER_URL || '' }}
          REACT_APP_DEMO_URL: ${{ matrix.app == 'sapmall-website' && secrets.DEMO_URL || '' }}
          REACT_APP_GITHUB_URL: ${{ matrix.app == 'sapmall-website' && secrets.GITHUB_URL || '' }}
          REACT_APP_TWITTER_URL: ${{ matrix.app == 'sapmall-website' && secrets.TWITTER_URL || '' }}
          REACT_APP_TELEGRAM_URL: ${{ matrix.app == 'sapmall-website' && secrets.TELEGRAM_URL || '' }}
          REACT_APP_DISCORD_URL: ${{ matrix.app == 'sapmall-website' && secrets.DISCORD_URL || '' }}

      - name: Upload artifact (${{ matrix.app }})
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}-${{ matrix.app }}
          path: |
            web_client/${{ matrix.app }}/build/
            .gitignore
          retention-days: 3

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend_service/go.sum

      - name: Build Backend
        run: |
          cd backend_service
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o main ./app/sapmall_start.go

      - name: Upload Backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: |
            backend_service/main
            .gitignore
          retention-days: 3

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-${{ github.sha }}-*
          merge-multiple: true

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}

      - name: Verify artifact layout
        run: |
          set -e
          for app in sapmall-admin sapmall-dapp sapmall-website; do
            d="web_client/${app}/build"
            echo "=== $d ==="
            test -d "$d"
            test -f "$d/index.html"
          done
          test -f backend_service/main

      - name: Upload Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "web_client/sapmall-admin/build,web_client/sapmall-dapp/build,web_client/sapmall-website/build"
          target: "/opt/sapmall/deploy/${{ github.sha }}"
          strip_components: 0
          overwrite: true

      - name: Upload Backend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "backend_service/main"
          target: "/opt/sapmall/deploy/${{ github.sha }}"
          strip_components: 0
          overwrite: true

      - name: Activate Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            DEPLOY_DIR="/opt/sapmall/deploy/${{ github.sha }}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_DIR="/opt/sapmall/backup/web_client_${TIMESTAMP}"

            sudo systemctl stop sapmall-backend
            mkdir -p /opt/sapmall/backup "$BACKUP_DIR"

            if [ -d /opt/sapmall/web_client ]; then
              cp -r /opt/sapmall/web_client "$BACKUP_DIR/"
            fi

            if [ -f /opt/sapmall/backend_service/main ]; then
              cp /opt/sapmall/backend_service/main "/opt/sapmall/backup/main_${TIMESTAMP}"
            fi

            for app in sapmall-admin sapmall-dapp sapmall-website; do
              mkdir -p "/opt/sapmall/web_client/${app}/build"
              cp -rf "${DEPLOY_DIR}/web_client/${app}/build/"* "/opt/sapmall/web_client/${app}/build/"
            done

            chmod +x "${DEPLOY_DIR}/backend_service/main"
            mkdir -p /opt/sapmall/backend_service
            cp "${DEPLOY_DIR}/backend_service/main" /opt/sapmall/backend_service/main

            sudo systemctl restart sapmall-backend
            sudo systemctl reload nginx

            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8888/api/common/health >/dev/null; then
                HEALTH_OK=1
                echo "Health check passed (attempt ${i})"
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Health check failed after 60s, rolling back..."
              sudo journalctl -u sapmall-backend -n 50 --no-pager || true
              LATEST_FRONTUP=$(ls -td /opt/sapmall/backup/web_client_* 2>/dev/null | head -1)
              if [ -n "$LATEST_FRONTUP" ] && [ -d "${LATEST_FRONTUP}/web_client" ]; then
                rm -rf /opt/sapmall/web_client
                cp -rf "${LATEST_FRONTUP}/web_client" /opt/sapmall/
              elif [ -n "$LATEST_FRONTUP" ]; then
                rm -rf /opt/sapmall/web_client
                cp -rf "$LATEST_FRONTUP" /opt/sapmall/web_client
              fi
              LATEST_BACKEND=$(ls -t /opt/sapmall/backup/main_* 2>/dev/null | head -1)
              if [ -n "$LATEST_BACKEND" ]; then
                cp -f "$LATEST_BACKEND" /opt/sapmall/backend_service/main
              fi
              sudo systemctl restart sapmall-backend
              exit 1
            fi

            rm -rf "${DEPLOY_DIR}"
            echo "Deployment successful: ${{ github.sha }}"
